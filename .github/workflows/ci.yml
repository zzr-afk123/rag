name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (${{ matrix.os }}/py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 演示机就是 Windows，路径分隔符与控制台编码 only 在这里能提前炸
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"

    env:
      # 真实模型包（sentence-transformers → torch）不在 requirements-dev.txt 里：
      # 测试全程用 mock 向量与 mock 精排，装它只会把 CI 拖成几分钟下载。
      RAG_FORCE_MOCK: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      # config/users.yaml 里是 PBKDF2 哈希，属于凭据，已 .gitignore 排除，仓库里只有模板。
      # 而 api/main.py 在 import 时就建 app，auth.enabled=true 且账号库为空会直接
      # ConfigError——不跑这一步，整条 API 测试链在干净检出上全部报错。
      - name: Create account store
        run: python scripts/manage_users.py init --weak-demo-passwords

      - name: Run tests
        run: python -m pytest -q --color=no
