# =========================================================
# 部门目录：关键词 → 部门 → 联系方式
#
# 用途有两处（都在「命中即提示」的语义下，不参与回答生成）：
#   1. 问答页：问题里出现某部门的关键词时，在答案下方提示该部门的联系方式；
#   2. 部门看板：统计「近 N 天各被问了多少次、问了什么」，周报按部门分发。
#
# ⚠️ 下面的电话/邮箱/地址/时间是**示例数据**，只为了把链路跑通。
#    上线前请按学校官网公布的口径替换，或直接删掉不需要的部门。
#    匹配是纯关键词命中（含同义词），不做语义推断，宁可漏配也不要误配。
# =========================================================

