# =========================================================
# 标准 logging.dictConfig 格式。
# ${LOG_DIR} / ${LEVEL} / ${RETAIN_DAYS} 由 logging_setup.py 在加载前替换，
# 因此这里可以安全地引用配置项而不写死路径。
# =========================================================
version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)-7s | %(name)-28s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  plain:
    format: "%(levelname)s | %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: ${LEVEL}
    formatter: plain
    # 日志走 stderr：脚本的 --json / 表格输出留在 stdout，管道才不会被日志行打断
    stream: ext://sys.stderr
  app_file:
    class: logging.handlers.TimedRotatingFileHandler
    level: ${LEVEL}
    formatter: standard
    filename: "${LOG_DIR}/app.log"
    when: midnight
    interval: 1
    backupCount: ${RETAIN_DAYS}
    encoding: utf-8
    delay: true
  error_file:
    class: logging.handlers.TimedRotatingFileHandler
    level: ERROR
    formatter: standard
    filename: "${LOG_DIR}/error.log"
    when: midnight
    interval: 1
    backupCount: ${RETAIN_DAYS}
    encoding: utf-8
    delay: true

loggers:
  rag_assistant:
    level: ${LEVEL}
    handlers: [console, app_file]
    propagate: false
  rag_assistant.error:
    level: ERROR
    handlers: [error_file]
    propagate: false
  # 模型已经下载到本地，启动时 huggingface_hub 仍会试连 hf-mirror，
  # 离线模式下每条都会打一条 "Cannot reach the Hub ... offline mode is enabled"。
  # 这些不是服务问题，压到 ERROR 免得把运维台的告警面板刷满。
  huggingface_hub:
    level: ERROR
    propagate: true
  urllib3:
    level: ERROR
    propagate: true

root:
  level: WARNING
  handlers: [console, app_file]
