<?xml version="1.0" encoding="UTF-8"?>
<!--
  自绘品牌标识（示意，非官方校徽）。
  为什么不用官方校徽：校徽是注册图形，直接内置会有版权问题；这里用同样的构图
  （双环 + 上弧校名 + 下弧英文 + 中心年份）做视觉锚点，需要正式使用时把本文件
  替换成学校提供的授权文件即可，页面只引用 /static/logo.svg，不必改代码。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-label="郑州大学 制度问答 品牌标识（示意）">
  <defs>
    <path id="arcTop" d="M 100,100 m -74,0 a 74,74 0 1,1 148,0" fill="none"/>
    <path id="arcBottom" d="M 100,100 m 66,0 a 66,66 0 1,0 -132,0" fill="none"/>
    <linearGradient id="disc" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1a6fc4"/>
      <stop offset="0.55" stop-color="#0d4c92"/>
      <stop offset="1" stop-color="#082f5c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6c98a"/>
      <stop offset="1" stop-color="#b98f43"/>
    </linearGradient>
  </defs>

  <!-- 底圆与双环 -->
  <circle cx="100" cy="100" r="98" fill="url(#disc)"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.6"/>
  <circle cx="100" cy="100" r="60" fill="none" stroke="url(#gold)" stroke-width="1.2" stroke-opacity="0.9"/>

  <!-- 上弧：中文校名 -->
  <text fill="#ffffff" font-family="Songti SC, STSong, SimSun, serif" font-size="21"
        letter-spacing="5" font-weight="600">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">郑州大学</textPath>
  </text>

  <!-- 下弧：英文校名 -->
  <text fill="#dbe7f6" font-family="Georgia, 'Times New Roman', serif" font-size="8.6"
        letter-spacing="1.6" opacity="0.9">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">ZHENGZHOU UNIVERSITY</textPath>
  </text>

  <!-- 中心：书本 + 上升的塔尖，象征"求是"与"担当" -->
  <g fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M72 92 h22 a6 6 0 0 1 6 6 v26 h-22 a6 6 0 0 1 -6 -6 z"/>
    <path d="M128 92 h-22 a6 6 0 0 0 -6 6 v26 h22 a6 6 0 0 0 6 -6 z"/>
    <path d="M100 98 v26"/>
    <path d="M86 84 l14 -16 l14 16"/>
  </g>
  <text x="100" y="142" text-anchor="middle" fill="#f3e3bd"
        font-family="Georgia, serif" font-size="11" letter-spacing="3">1956</text>
</svg>
