# Nginx 反向代理示例（把 127.0.0.1:8000 变成 https://你的域名）
#
# 用法：
#   1. 把本文件复制到 /etc/nginx/conf.d/rag-assistant.conf，改 server_name 与证书路径；
#   2. nginx -t && systemctl reload nginx；
#   3. 应用本身仍然只监听 127.0.0.1（或容器内 8000），公网只暴露 443。
#
# 两个关键点（都在这份配置里体现）：
#   - **/chat/stream 必须关缓冲**：否则 Nginx 会把 SSE 攒成一整段再发，流式就没了；
#   - **传 X-Forwarded-For / X-Forwarded-Proto**：应用要据此识别真实客户端 IP 做限流，
#     并按 https 生成链接。uvicorn 侧必须带 --proxy-headers（Dockerfile 已加）。

upstream rag_assistant {
    server 127.0.0.1:8000;
    keepalive 16;
}

# 80 → 443
server {
    listen 80;
    listen [::]:80;
    server_name zhidu.example.edu.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zhidu.example.edu.cn;

    ssl_certificate     /etc/letsencrypt/live/zhidu.example.edu.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhidu.example.edu.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 学校制度文档一般不大；上传入口没有，8m 足够
    client_max_body_size 8m;

    gzip on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json text/markdown image/svg+xml;

    # 安全头（页面无外链脚本，可以直接上较严的 CSP）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;

    # ---- 流式问答：单独一段，关掉所有缓冲 ----
    location = /chat/stream {
        proxy_pass http://rag_assistant;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ---- 部门看板：默认放开；想只给校内网就取消注释 ----
    # location /dept {
    #     allow 10.0.0.0/8;
    #     allow 192.168.0.0/16;
    #     allow 172.16.0.0/12;
    #     deny all;
    #     proxy_pass http://rag_assistant;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    # ---- 其余（页面 / API / 静态资源）----
    location / {
        proxy_pass http://rag_assistant;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 静态资源可缓存（logo/manifest）。注意别把 /chat 前缀匹配进来。
    location /static/ {
        proxy_pass http://rag_assistant;
        proxy_set_header Host $host;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
