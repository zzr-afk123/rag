# 单服务部署：应用 + 挂载的数据/日志/模型缓存卷
#
#   cp .env.example .env      # 填 DEEPSEEK_API_KEY；不填则自动 mock
#   docker compose up -d --build
#   curl http://127.0.0.1:8000/health
#
# 首次启动会下载 bge-m3 与 bge-reranker-v2-m3（约 4.5GB）到 hf-cache 卷，
# 期间 /health 可能 200 但检索很慢——用 docker compose logs -f 观察进度。

services:
  rag:
    build: .
    image: rag-assistant:latest
    container_name: rag-assistant
    ports:
      # 前面挂 Nginx/Caddy 时改成 "127.0.0.1:8000:8000"，公网只暴露 443
      - "8000:8000"
    env_file:
      - .env
    environment:
      HF_ENDPOINT: https://hf-mirror.com
      HF_HOME: /data/hf
      # 无 Key 时自动 mock；想强制 mock 就取消注释
      # RAG_FORCE_MOCK: "1"
      # 定时扫描间隔（秒）：新增文档最迟这么久可检索
      RAG_SYNC__INTERVAL_SECONDS: "60"
      TZ: Asia/Shanghai
      # 对外域名：填了控制台会显示"对外地址"（只展示，不参与路由）
      # RAG_SERVER__PUBLIC_URL: "https://zhidu.example.edu.cn"
      # 公网部署建议打开：问答令牌 + 部门看板令牌（也可以写在 .env）
      # RAG_SERVER__PUBLIC_ACCESS_TOKEN: "换成足够长的随机串"
      # RAG_DEPT_CONSOLE__TOKEN: "换成足够长的随机串"
      # 周报发信密码（只放环境变量，不写进 YAML）
      # SMTP_PASSWORD: ""
    volumes:
      - ./data:/app/data          # 知识库文档 + 索引（manifest/chroma/bm25）
      - ./logs:/app/logs
      - ./reports:/app/reports
      - hf-cache:/data/hf         # 模型权重缓存，避免每次重建镜像都重下
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # CPU 推理 + 4.5GB 权重，2GB 内存会 OOM
          memory: 6g

volumes:
  hf-cache:
